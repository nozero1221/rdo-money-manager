name: Deploy RDO Money Manager

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Load tracker modules
        run: |
          python - <<'PY'
          from pathlib import Path

          # Red Dead tracker modules. Version query prevents iOS Safari from
          # reopening an older cached JS module after a deploy.
          p = Path('index.html')
          s = p.read_text()
          tags = [
              '<script src="./naturalist.js?v=20260824"></script>',
              '<script src="./legendary-advisor.js?v=20260824"></script>',
              '<script src="./legendary-collection.js?v=20260824"></script>',
              '<script src="./resume-sync.js?v=20260824"></script>'
          ]
          # Remove older unversioned/versioned injected copies first.
          import re
          for name in ['naturalist.js','legendary-advisor.js','legendary-collection.js','resume-sync.js']:
              s = re.sub(r'<script src="\./' + re.escape(name) + r'(?:\?v=[^"]*)?"></script>', '', s)
          s = s.replace('</body>', ''.join(tags) + '</body>')
          p.write_text(s)

          # GTA tracker modules
          gta = Path('gta/index.html')
          if gta.exists():
              g = gta.read_text()
              tag = '<script src="./login-plan.js"></script>'
              if tag not in g:
                  g = g.replace('</body>', tag + '</body>')
              gta.write_text(g)
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
