name: Deploy RDO Money Manager

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Load tracker modules
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # RDO tracker modules. durable-state loads first so it can restore
          # persisted state before the feature modules read their localStorage.
          p = Path('index.html')
          s = p.read_text()
          names = [
              'durable-state.js',
              'resume-sync.js',
              'moonshine-buyers.js',
              'naturalist.js',
              'legendary-advisor.js',
              'legendary-collection.js',
          ]
          for name in names:
              s = re.sub(r'<script src="\./' + re.escape(name) + r'(?:\?v=[^"]*)?"></script>', '', s)
          tags = [f'<script src="./{name}?v=20260909b"></script>' for name in names]
          s = s.replace('</body>', ''.join(tags) + '</body>')
          p.write_text(s)

          # GTA tracker modules
          gta = Path('gta/index.html')
          if gta.exists():
              g = gta.read_text()
              tag = '<script src="./login-plan.js"></script>'
              if tag not in g:
                  g = g.replace('</body>', tag + '</body>')
              gta.write_text(g)
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
