name: Deploy RDO Money Manager

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Load tracker modules
        run: |
          python - <<'PY'
          from pathlib import Path

          # Red Dead tracker modules
          p = Path('index.html')
          s = p.read_text()
          tags = [
              '<script src="./naturalist.js"></script>',
              '<script src="./legendary-advisor.js"></script>',
              '<script src="./legendary-collection.js"></script>'
          ]
          for tag in tags:
              if tag not in s:
                  s = s.replace('</body>', tag + '</body>')
          p.write_text(s)

          # GTA tracker modules
          gta = Path('gta/index.html')
          if gta.exists():
              g = gta.read_text()
              tag = '<script src="./login-plan.js"></script>'
              if tag not in g:
                  g = g.replace('</body>', tag + '</body>')
              gta.write_text(g)
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
